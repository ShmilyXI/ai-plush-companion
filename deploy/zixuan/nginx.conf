upstream zixuan_manager_api {
    server 127.0.0.1:8002;
}

upstream zixuan_runtime_ws {
    server 127.0.0.1:8000;
}

upstream zixuan_runtime_http {
    server 127.0.0.1:8003;
}

upstream zixuan_companion_web {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;

    location ~ ^/xiaozhi(?:/|$) {
        return 410;
    }

    location /zixuan/v1/ {
        proxy_pass http://zixuan_runtime_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /zixuan/internal/playground/ {
        proxy_pass http://zixuan_runtime_http;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /zixuan/ota/ {
        proxy_pass http://zixuan_manager_api;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /zixuan/ {
        proxy_pass http://zixuan_manager_api;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /api/v1/ {
        proxy_pass http://zixuan_manager_api;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location ~ ^/api/(agents|auth|conversations|session|voices)(?:/|$) {
        proxy_pass http://zixuan_companion_web;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /internal/ {
        proxy_pass http://zixuan_manager_api;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /mcp/ {
        proxy_pass http://zixuan_runtime_http;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /_next/ {
        proxy_pass http://zixuan_companion_web;
        proxy_set_header Host $host;
    }

    location /companion/ {
        proxy_pass http://zixuan_companion_web/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        root /opt/zixuan/server/companion-console;
        try_files $uri $uri/ /index.html;
    }
}
