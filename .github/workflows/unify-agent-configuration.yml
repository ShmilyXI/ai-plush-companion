name: unify-agent-configuration

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The firmware gate reads board configs at the release manifest's sourceRevision.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/main/companion-console/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Zixuan identity gate tests
        run: node --test scripts/verify-zixuan-*.test.mjs
      - name: Manager API tests
        working-directory: server/main/manager-api
        # The pom sets skipTests=true for local packaging, so turn tests on here. DeviceTest and
        # loginControllerTest boot the dev profile against a live MySQL/Redis, which CI does not run.
        run: >-
          mvn -q test -DskipTests=false
          '-Dtest=!DeviceTest,!loginControllerTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Companion console checks
        working-directory: server/main/companion-console
        run: |
          npm ci
          npm run lint
          npm run build
          npm test -- --run
          npx playwright install --with-deps chromium
          # Visual baselines are recorded on macOS (*-darwin.png) and Linux renders fonts
          # differently, so CI checks behaviour and accessibility, not pixels.
          npm run test:e2e -- --ignore-snapshots
      - name: Python runtime checks
        working-directory: server/main/zixuan-server
        run: |
          # opuslib_next loads the system Opus library at import time.
          sudo apt-get update -qq && sudo apt-get install -y -qq libopus0
          # CPU wheels first so requirements.txt does not pull the multi-GB CUDA build of torch.
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_capability_bundle_client.py tests/test_companion_memory_management.py tests/test_migration_audit_contract.py tests/integration/test_tencentdb_memory_provider_flow.py
      - name: MQTT gateway checks
        working-directory: mqtt-gateway
        run: |
          # The contract tests load the gateway's Node modules; its lockfile is not tracked.
          npm install --no-audit --no-fund --no-package-lock
          python -m pip install pytest
          python -m pytest -q
      - name: OpenSpec and diff gates
        run: |
          npm install -g @fission-ai/openspec@1.4.1
          openspec validate --changes --json
          git diff --check
