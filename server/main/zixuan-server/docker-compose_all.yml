# Docker安装全模块

version: '3'
services:
  # Server模块
  zixuan-server:
    image: ai-plush/zixuan-server:latest
    container_name: zixuan-server
    depends_on:
      - zixuan-db
      - zixuan-redis
    restart: always
    networks:
      - default
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于视觉分析接口
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置文件目录
      - ./data:/opt/zixuan-server/data
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/zixuan-server/models/SenseVoiceSmall/model.pt

  # manager-api 和 companion-console 管理台镜像
  zixuan-manager-web:
    image: ai-plush/zixuan-manager-web:latest
    container_name: zixuan-manager-web
    restart: always
    networks:
      - default
    depends_on:
      zixuan-db:
        condition: service_healthy
      zixuan-redis:
        condition: service_healthy
    ports:
      # 智控台
      - "8002:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://zixuan-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=zixuan-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      # 配置文件目录
      - ./uploadfile:/uploadfile

  tencentdb-memory-core:
    image: agentmemory/memory-core:1.0.0@sha256:f9b286246d0e5020a7f0cb011b7074703d10b76b424a834a117482392f7bd424
    restart: unless-stopped
    depends_on:
      - zixuan-manager-web
    networks:
      - default
    expose:
      - "8420"
    environment:
      TDAI_GATEWAY_CONFIG: /tmp/tdai-gateway.yaml
      TENCENTDB_MEMORY_CORE_KEY: ${TENCENTDB_MEMORY_CORE_KEY:?请设置 TENCENTDB_MEMORY_CORE_KEY}
      TENCENTDB_MEMORY_MODEL_PROXY_KEY: ${TENCENTDB_MEMORY_MODEL_PROXY_KEY:?请设置 TENCENTDB_MEMORY_MODEL_PROXY_KEY}
      TENCENTDB_MEMORY_EMBEDDING_DIMENSIONS: ${TENCENTDB_MEMORY_EMBEDDING_DIMENSIONS:-1024}
      TENCENTDB_MEMORY_MODEL_PROXY_BASE_URL: ${TENCENTDB_MEMORY_MODEL_PROXY_BASE_URL:-http://zixuan-manager-web:8002/zixuan/internal/tencentdb-memory-model/v1}
    volumes:
      - tencentdb_memory_data:/data/tdai-memory
      - ./deploy/tencentdb-memory/tdai-gateway.template.yaml:/data/config/tdai-gateway.template.yaml:ro
      - ./deploy/tencentdb-memory/render-gateway-config.mjs:/data/config/render-gateway-config.mjs:ro
    command: >-
      sh -c "node /data/config/render-gateway-config.mjs
      /data/config/tdai-gateway.template.yaml /tmp/tdai-gateway.yaml
      && exec node --import tsx src/gateway/server.ts"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8420/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  # 数据库模块
  zixuan-db:
    image: mysql:latest
    container_name: zixuan-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # redis模块
  zixuan-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: zixuan-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
networks:
  default:

volumes:
  tencentdb_memory_data:
